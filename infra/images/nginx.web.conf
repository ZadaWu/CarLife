server {
  listen 80;
  # IPv6 也要听：容器内 `localhost` 在 Alpine 上先解析成 ::1，只听 IPv4 的话
  # healthcheck 里的 wget 会拿到 Connection refused，容器被判 unhealthy——
  # 而从外面访问一切正常，于是"服务能用但显示不健康"，最难对上号的一类。
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /console/ {
    proxy_pass http://gateway:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }


  # 带哈希文件名的产物可以永久缓存——名字变了就是新文件。
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ⚠️ index.html **绝不能被缓存**。nginx 默认只发 ETag/Last-Modified，浏览器会按
  # 启发式规则直接复用旧副本，而旧 index.html 指向的是上一版的哈希 JS——
  # 结果是"发布成功了、产物也确实是新的，但访问过的人一直看到旧界面"，
  # 而且强刷一次就好，最容易被当成偶发。所以显式要求每次都回源校验。
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
