[project]
name = "carlife-vision-trainer"
version = "0.1.0"
description = "CarLife 内部工具：警示灯小检测器的训练 / 验证 / 推理 / 导出常驻服务（ACR-026 / M76-01）"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "ultralytics>=8.3",
  "pillow>=10",
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vision_trainer"]
